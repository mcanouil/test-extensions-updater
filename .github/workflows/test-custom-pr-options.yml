name: Test Custom PR Options

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-custom-pr-options:
    runs-on: ubuntu-latest
    name: Test custom PR titles, labels, and assignees
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "release"

      - name: Update with custom PR configuration
        uses: mcanouil/quarto-extensions-updater@refactor/quarto-wizard-core
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          branch-prefix: deps/quarto-extensions
          commit-message-prefix: "build(deps): Update Quarto extensions"
          pr-title-prefix: ":arrow_up: Update Quarto extensions"
          pr-labels: dependencies,quarto,extensions,automated
          pr-assignees: mcanouil
          pr-reviewers: mcanouil
