name: Test Basic Functionality

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-basic:
    runs-on: ubuntu-latest
    name: Test basic extension update
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update Quarto extensions (basic)
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
