name: Test Workspace Path

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-workspace-path:
    runs-on: ubuntu-latest
    name: Test custom workspace path
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update with custom workspace
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          branch-prefix: test/workspace-path
