name: Test Update Strategy Patch

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-patch-only:
    runs-on: ubuntu-latest
    name: Test patch updates only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "release"

      - name: Update Quarto extensions (patch only)
        uses: mcanouil/quarto-extensions-updater@refactor/quarto-wizard-core
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          update-strategy: patch
