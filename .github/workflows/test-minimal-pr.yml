name: Test Minimal PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-minimal-pr:
    runs-on: ubuntu-latest
    name: Test minimal PR configuration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update with minimal PR configuration
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          branch-prefix: quarto-ext-minimal
