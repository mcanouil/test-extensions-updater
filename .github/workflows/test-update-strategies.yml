name: Test Update Strategies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  test-patch-only:
    runs-on: ubuntu-latest
    name: Test patch updates only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update Quarto extensions (patch only)
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          update-strategy: patch
          branch-prefix: chore/quarto-ext-patch-only
          pr-title: "chore: Update {{extension}} (patch)"
          pr-labels: |
            dependencies
            patch-only

  test-minor-only:
    runs-on: ubuntu-latest
    name: Test minor updates only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update Quarto extensions (minor only)
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          update-strategy: minor
          branch-prefix: chore/quarto-ext-minor-only
          pr-title: "chore: Update {{extension}} (minor)"
          pr-labels: |
            dependencies
            minor-only

  test-all-updates:
    runs-on: ubuntu-latest
    name: Test all updates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update Quarto extensions (all)
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          update-strategy: all
          branch-prefix: chore/quarto-ext-all-updates
          pr-title: "chore: Update {{extension}}"
          pr-labels: dependencies
