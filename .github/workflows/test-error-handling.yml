name: Test Error Handling

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-error-handling:
    runs-on: ubuntu-latest
    name: Test error handling
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "release"

      - name: Test with potentially invalid configuration
        uses: mcanouil/quarto-extensions-updater@refactor/quarto-wizard-core
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          include-extensions: |
            non-existent/extension
          branch-prefix: test/error-handling

      - name: Report test result
        if: always()
        run: echo "Error handling test completed"
