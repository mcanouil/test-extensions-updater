name: Test Branch Configuration

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-branch-configuration:
    runs-on: ubuntu-latest
    name: Test branch configuration options
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "release"

      - name: Update with custom branch settings
        uses: mcanouil/quarto-extensions-updater@refactor/quarto-wizard-core
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          branch-prefix: test/branch-config
          commit-message-prefix: "test: Custom branch configuration"
