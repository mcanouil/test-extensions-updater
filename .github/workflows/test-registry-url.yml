name: Test Registry URL

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-registry-url:
    runs-on: ubuntu-latest
    name: Test custom registry URL
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update with custom registry
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          branch-prefix: test/custom-registry
