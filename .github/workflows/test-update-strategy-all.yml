name: Test Update Strategy All

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  test-all-updates:
    runs-on: ubuntu-latest
    name: Test all updates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update Quarto extensions (all)
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          update-strategy: all
