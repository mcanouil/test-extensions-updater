name: Test Auto-Merge All

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  test-auto-merge-all:
    runs-on: ubuntu-latest
    name: Test auto-merge all updates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update Quarto extensions (auto-merge all)
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          auto-merge: true
          auto-merge-strategy: all
