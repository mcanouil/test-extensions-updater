name: Test Auto-Merge Patch

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-auto-merge-patch:
    runs-on: ubuntu-latest
    name: Test auto-merge patch updates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "release"

      - name: Update Quarto extensions (auto-merge patch)
        uses: mcanouil/quarto-extensions-updater@refactor/quarto-wizard-core
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          auto-merge: true
          auto-merge-strategy: patch
