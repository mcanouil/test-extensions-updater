name: Test Auto-Merge Strategies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  test-auto-merge-patch:
    runs-on: ubuntu-latest
    name: Test auto-merge patch updates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update Quarto extensions (auto-merge patch)
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          auto-merge: true
          auto-merge-strategy: patch
          merge-method: squash
          branch-prefix: chore/quarto-ext-patch
          pr-title: "chore: Update {{extension}} to {{version}}"
          pr-labels: |
            dependencies
            auto-merge
            patch

  test-auto-merge-minor:
    runs-on: ubuntu-latest
    name: Test auto-merge minor updates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update Quarto extensions (auto-merge minor)
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          auto-merge: true
          auto-merge-strategy: minor
          merge-method: merge
          branch-prefix: chore/quarto-ext-minor
          pr-title: "chore: Update {{extension}} to {{version}}"
          pr-labels: |
            dependencies
            auto-merge
            minor

  test-auto-merge-all:
    runs-on: ubuntu-latest
    name: Test auto-merge all updates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update Quarto extensions (auto-merge all)
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          auto-merge: true
          auto-merge-strategy: all
          merge-method: rebase
          branch-prefix: chore/quarto-ext-all
          pr-title: "chore: Update {{extension}} to {{version}}"
          pr-labels: |
            dependencies
            auto-merge
