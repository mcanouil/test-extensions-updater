name: Test Include Exclude

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-include-exclude:
    runs-on: ubuntu-latest
    name: Test include and exclude filters
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update specific extensions only
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          include-extensions: |
            mcanouil/iconify
          branch-prefix: quarto-ext-filtered
          pr-title-prefix: "chore: Update Quarto extensions (filtered)"
