name: Test Dry Run with Issue Creation

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  test-dry-run-with-pr-disabled:
    runs-on: ubuntu-latest
    name: Test dry-run with PR creation disabled
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "release"

      - name: Check for updates (no PR)
        id: check-updates
        uses: mcanouil/quarto-extensions-updater@refactor/quarto-wizard-core
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: false

      - name: Create issue if updates available
        if: steps.check-updates.outputs.updates-available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const updates = JSON.parse('${{ steps.check-updates.outputs.updates }}');
            const updateList = updates.map(u => `- ${u.name}: ${u.currentVersion} → ${u.latestVersion}`).join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Quarto Extension Updates Available (${updates.length})`,
              body: `## Available Updates\n\n${updateList}\n\nRun the updater workflow to create PRs.`
            });
