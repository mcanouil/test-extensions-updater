name: Test Custom PR Configuration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  test-custom-pr-options:
    runs-on: ubuntu-latest
    name: Test custom PR titles, labels, and assignees
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update with custom PR configuration
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          branch-prefix: deps/quarto-extensions
          commit-message: "build(deps): Update {{extension}} from {{old-version}} to {{version}}"
          pr-title: ":arrow_up: Update {{extension}} to v{{version}}"
          pr-body: |
            ## Extension Update

            **Extension**: {{extension}}
            **Old Version**: {{old-version}}
            **New Version**: {{version}}

            ### Release Notes

            {{release-notes}}

            ---
            *This PR was automatically generated by the Quarto Extensions Updater*
          pr-labels: |
            dependencies
            quarto
            extensions
            automated
          assignees: mcanouil
          reviewers: mcanouil

  test-minimal-pr:
    runs-on: ubuntu-latest
    name: Test minimal PR configuration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update with minimal PR configuration
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          branch-prefix: quarto-ext-minimal

  test-include-exclude:
    runs-on: ubuntu-latest
    name: Test include and exclude filters
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update specific extensions only
        uses: mcanouil/quarto-extensions-updater@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workspace-path: .
          create-pr: true
          base-branch: main
          include: |
            mcanouil/iconify
          branch-prefix: quarto-ext-filtered
          pr-title: "chore: Update {{extension}} (filtered)"
